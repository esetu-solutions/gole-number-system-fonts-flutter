name: gole_number_system_fonts
description: >-
  The GoleStandard fonts for the Gole Number System (base 100: one symbol for
  each pair of decimal digits), in Ligature and PUA builds.
version: 1.0.0
homepage: https://www.esetu.in/gole-number-system
repository: https://github.com/esetu-solutions/gole-number-system-fonts-flutter
issue_tracker: https://github.com/esetu-solutions/gole-number-system-fonts-flutter/issues
topics:
  - fonts
  - numbers
  - gole

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    # Ligature build: the text stays as padded decimal digits; the font joins each pair.
    - family: GoleStandard
      fonts:
        - asset: fonts/GoleStandard.ttf
    # PUA build: one Private Use Area character (U+E441 to U+E4A4) per pair.
    - family: GoleStandardPUA
      fonts:
        - asset: fonts/GoleStandard_PUA.ttf
